<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Prep Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Interview Prep Dashboard</h1>
      <p id="generatedAt">Loading analytics...</p>
    </div>
    <div class="readiness">
      <span id="readinessValue">0%</span>
      <small>readiness</small>
    </div>
  </header>

  <main>
    <section class="metrics" aria-label="Key metrics">
      <article>
        <span id="sessionsAttempted">0</span>
        <small>sessions attempted</small>
      </article>
      <article>
        <span id="streakDays">0</span>
        <small>day streak</small>
      </article>
      <article>
        <span id="averageQuality">0</span>
        <small>avg quality</small>
      </article>
      <article>
        <span id="revisionFrequency">0%</span>
        <small>revision frequency</small>
      </article>
      <article>
        <span id="gitCommitCount">0</span>
        <small>git commits</small>
      </article>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Mode Split</h2>
        <div class="bar">
          <div id="coreBar" class="bar-core"></div>
          <div id="broadBar" class="bar-broad"></div>
        </div>
        <div class="legend">
          <span><i class="core-dot"></i>Core <b id="coreCount">0</b></span>
          <span><i class="broad-dot"></i>Broad <b id="broadCount">0</b></span>
        </div>
      </article>

      <article class="panel">
        <h2>Weak Topics</h2>
        <ul id="weakTopics" class="list"></ul>
      </article>

      <article class="panel">
        <h2>Topics Covered</h2>
        <ul id="topicsCovered" class="list"></ul>
      </article>

      <article class="panel">
        <h2>Energy Trend</h2>
        <ul id="energyTrend" class="list"></ul>
      </article>
    </section>

    <section class="panel">
      <h2>Session Log</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Mode</th>
              <th>Topic</th>
              <th>Energy</th>
              <th>Score</th>
              <th>Revision</th>
            </tr>
          </thead>
          <tbody id="sessionRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
